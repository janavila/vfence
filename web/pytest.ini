# Configuração do pytest para o Central.
#
# Por que este arquivo existe: sem ele, "pytest" e "python -m pytest" se
# comportam de forma diferente quanto ao que é importável, e metade do
# grupo veria "ModuleNotFoundError: backend" dependendo de como chamou.
#
#   pythonpath = .   -> a pasta web/ entra no caminho de importação, então
#                       "from backend.config import ..." funciona sempre
#   testpaths  = tests -> "pytest" sem argumento já roda a suíte certa

[pytest]
pythonpath = .
testpaths = tests
addopts = -q
